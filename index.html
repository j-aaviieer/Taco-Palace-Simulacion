<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taco Palace</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>

<body>
    <header>
        <nav class="nav-bar">
            <div class="title-container">
                <img src="static/images/logo.png" alt="logo" class="logo" />
                <h1><span class="taco-span">Taco</span>Palace</h1>
            </div>
            <div class="gamatoto">
                <div class="login-container" id="loginContainer">
                    <input type="email" placeholder="email" required class="email" id="login"/>
                    <button type="button" class="login-button" id="loginButton">Login</button>
                </div>
                <div class="cart-container">
                    <img src="static/images/carrito.png" alt="cart" class="cart" />
                    <p id="foodCounter">0</p>
                </div>
            </div>
        </nav>
    </header>
<!------------------------------------------------------------------------------------------->
    <main>
        <div class="section-arriba">
            <div class="food-container">
                <div class="tarjeta-food">
                    <img src="static/images/enchiladas.jpg" alt="enchiladas" class="food-image"/>
                    <p>Enchiladas</p>
                </div>
                <div class="tarjeta-food">
                    <img src="static/images/tacos.jpg" alt="tacos" class="food-image"/>
                    <p>Tacos</p>
                </div>
                <div class="tarjeta-food">
                    <img src="static/images/flautas.jpg" alt="flautas" class="food-image"/>
                    <p>Flautas</p>
                </div>
                <div class="tarjeta-food">
                    <img src="static/images/gorditas.jpg" alt="gorditas" class="food-image"/>
                    <p>Gorditas</p>
                </div>
                <div class="tarjeta-food">
                    <img src="static/images/tostadas.jpg" alt="tostadas" class="food-image"/>
                    <p>Tostadas</p>
                </div>
                <div class="tarjeta-food">
                    <img src="static/images/enfrijoladas.jpg" alt="enfrijoladas" class="food-image"/>
                    <p>Enfrijoladas</p>
                </div>
            </div>
        </div>
<!-------------------------------------------------------------------------------------------->
        <div class="section-abajo">
            <div class="section-left">
                <div class="section-left-text">
                    <div>
                        <h2 class="section-left-title">La mejor variedad en platillos de comida <span class="mexicana">mexicana</span></h2>
                    </div>
                    <div>
                        <h3 class="section-left-subtitle">Contamos con <a href="#"><span class="servicio">servicio</span></a> a <span class="domicilio">domicilio</span></h3>
                    </div>
                </div>
                <div id="imageContainer">
                    <img src="static/images/comida-mexicana.jpg" alt="section-left-image" class="section-left-image"/>
                </div>
            </div>
<!-------------------------------------------------------------------------------------------->
            <section class="section-right">
                <h2>Recomendados:</h2>
                <div class="tarjeta">
                    <img src="static/images/orden-tacos.jpg" alt="orden-tacos" class="section-right-image"/>
                    <div class="orders">
                        <div>
                            <p>Orden de Tacos</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <div>
                            <button class="order-button" id="orderButton">+</button>
                        </div>
                    </div>
                </div>
                <div class="tarjeta">
                    <img src="static/images/orden-flautas.jpg" alt="orden-flautas" class="section-right-image"/>
                    <div class="orders">
                        <div>
                            <p>Orden de Flautas</p>
                            <a href="#">Ver Más...</a>
                        </div>
                        <div>
                            <button class="order-button" id="orderButton2">+</button>
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>
    <script src="static/js/script.js"></script>
</body>

</html>
